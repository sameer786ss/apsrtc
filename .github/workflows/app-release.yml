name: App Release

# Tag vX.Y.Z -> signed APK published to GitHub Releases (apps/mobile-union).
# The in-app updater reads /releases/latest and installs the .apk asset.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build and release (e.g. v1.0.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: app-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.2'
  JAVA_VERSION: '17'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile-union
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Derive build name and number from tag
        id: version
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$VERSION' must look like v1.2.3"
            exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          if (( minor > 999 || patch > 999 )); then
            echo "::error::minor and patch must be below 1000"
            exit 1
          fi
          # versionCode must grow with every release or Android refuses the update.
          echo "name=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 1000000 + minor * 1000 + patch ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Write signing key and Firebase config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?KEYSTORE_BASE64 secret is not set}"
          : "${KEYSTORE_PASSWORD:?KEYSTORE_PASSWORD secret is not set}"
          : "${KEY_PASSWORD:?KEY_PASSWORD secret is not set}"
          : "${KEY_ALIAS:?KEY_ALIAS secret is not set}"
          : "${GOOGLE_SERVICES_JSON_BASE64:?GOOGLE_SERVICES_JSON_BASE64 secret is not set}"

          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.keystore"
          } > android/key.properties
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release \
            --obfuscate --split-debug-info=build/debug-info \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.code }}"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/apptd-union.apk

      - name: Remove secrets from runner
        if: always()
        run: rm -f android/app/release.keystore android/key.properties android/app/google-services.json

      - name: Keep obfuscation symbols (needed to read crash stack traces)
        uses: actions/upload-artifact@v4
        with:
          name: debug-info-${{ env.VERSION }}
          path: apps/mobile-union/build/debug-info
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: APPTD Union ${{ env.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: apps/mobile-union/build/app/outputs/flutter-apk/apptd-union.apk
